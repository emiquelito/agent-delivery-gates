# The delivery gates, running with no agent involved.
#
# The checks that stop an agent mid-edit are ordinary programs with exit
# codes, so they also run here on every push and pull request. This file is a
# starting point: keep the steps that apply to your project and delete the
# rest.

name: delivery gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The prose scan reads tracked files and the test diff check reads
          # history. A shallow clone hides both.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # Off unless the project turned it on with `adg init --prose-preset
      # NAME`. That command writes .adg/prose-rules.txt, and only its
      # presence decides whether this step runs at all. Once it is there,
      # --require-rules stays on so a rules file that goes missing later
      # fails instead of reading as a clean run, and the baseline is only
      # passed when it exists so a project that never records one is not
      # sent looking for a file it never created.
      - name: prose scan
        run: |
          if [ -f .adg/prose-rules.txt ]; then
            if [ -f .adg/prose-baseline.txt ]; then
              npx agent-delivery-gates scan-prose --require-rules --baseline .adg/prose-baseline.txt
            else
              npx agent-delivery-gates scan-prose --require-rules
            fi
          else
            echo "prose scan -- skipped (no .adg/prose-rules.txt; run init --prose-preset to turn this on)"
          fi

      # Fails when the tally names a rule that does not exist, repeats an
      # entry number, or points at a file that is not there.
      - name: tally check
        run: npx agent-delivery-gates tally --check

  test-diff:
    # What changed in the tests, reported apart from what changed in the
    # source, for the whole range of a pull request.
    #
    # This exits 1 when it finds a weakening, so the job fails and someone
    # looks. A signal is a place to look and not proof on its own, so if that
    # is too strong for your project, add continue-on-error: true to the step
    # and read the summary instead.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: report the test diff apart from the source diff
        run: |
          npx agent-delivery-gates test-diff \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            | tee "$GITHUB_STEP_SUMMARY"

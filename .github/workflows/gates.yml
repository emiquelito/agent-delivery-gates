# The gates, running with no agent involved.
#
# The two command line tools are ordinary programs with exit codes, so the
# same checks that stop an agent mid-edit also run here on every push. This
# workflow is what this repository runs on itself.

name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Every platform this tool claims to run on gets its own leg of the
    # same job, over a matrix, instead of three near-duplicate jobs that
    # would drift apart the way copy-pasted CI config always does. This is
    # what actually stands behind spawn-command's platform split (POSIX
    # process-group kill vs. Windows' `taskkill /t`): before this, every
    # job here was ubuntu-latest, so a macOS or Windows regression in that
    # split had nothing running it, and a past round of macOS-only bugs
    # was found solely because the owner happened to run the tool on a
    # Mac by hand.
    #
    # The prose scan, the tally check, and the README tally check read
    # tracked prose and doc figures; nothing about them depends on the
    # operating system underneath, so running them on all three legs would
    # burn CI minutes three times over for the same single answer. They
    # run once, gated to the ubuntu-latest leg below. Typecheck and the
    # test suite are not given that treatment: they are the whole reason
    # for the matrix, since they exercise process spawning, signal
    # handling, and path behaviour that actually differs by platform, so
    # they run on every leg in full. No leg skips them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Declared, not inherited. The repository default is read only
    # today, and a job that says nothing is safe only for as long as
    # nobody changes that setting. This workflow runs on a pull
    # request, so it executes a contributor's code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The prose scan and the tally check read tracked files, and the
          # test diff check reads history. A shallow clone hides both.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # package.json's engines field requires >=22.18; '22' resolves
          # to the newest 22.x release on every runner, which satisfies
          # that today and keeps doing so as 22.x moves forward.
          node-version: '22'

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: tests
        run: npm test

      # Platform-independent checks: run once, on Linux only. See the
      # comment above the matrix for why.
      - name: prose scan
        if: matrix.os == 'ubuntu-latest'
        run: node hooks/scan-prose.ts --require-rules

      - name: tally check
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/tally-report.ts --check

      - name: README tally check
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/refresh-readme-tally.ts --check

  test-diff:
    # What changed in the tests, reported apart from what changed in the
    # source. On a pull request this reads the whole range, so a weakening
    # buried in the middle of a branch is still reported.
    runs-on: ubuntu-latest
    # Declared, not inherited. The repository default is read only
    # today, and a job that says nothing is safe only for as long as
    # nobody changes that setting. This workflow runs on a pull
    # request, so it executes a contributor's code.
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: report the test diff apart from the source diff
        run: |
          node hooks/test-diff-separator.ts \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            | tee "$GITHUB_STEP_SUMMARY"
